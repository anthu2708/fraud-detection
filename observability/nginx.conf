# Local stand-in for the Traefik ingress on the real VM — proxies /grafana
# to the grafana container WITHOUT stripping the prefix, matching how
# Traefik routes it in k8s/observability.yaml. Lets us catch sub-path
# issues (broken assets, redirect loops) locally before deploying.
server {
    listen 8090;

    location /grafana {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else goes to query_api, same as fraud.anphung.dev in prod —
    # needed so the /demo page's relative iframe links to /grafana resolve
    # correctly when testing locally.
    location / {
        proxy_pass http://query_api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
