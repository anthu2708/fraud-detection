name: Manual Build

on:
  workflow_dispatch:
    inputs:
      scoring:
        description: "Rebuild scoring"
        type: boolean
        default: false
      producer:
        description: "Rebuild producer"
        type: boolean
        default: false
      query-api:
        description: "Rebuild query-api"
        type: boolean
        default: false
      ref:
        description: "Git SHA or branch to build from"
        required: false
        default: master

jobs:
  build-scoring:
    if: ${{ inputs.scoring == true }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: scoring/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/scoring:${{ steps.meta.outputs.sha }}
      - run: echo "Pushed scoring:${{ steps.meta.outputs.sha }}"
      - name: Bump scoring image tag in helm values (on master)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin master
            git checkout -B master origin/master
            sed -i "s|^  tag: .*|  tag: ${{ steps.meta.outputs.sha }}|" helm/fraud-detection/values-scoring.yaml
            git add helm/fraud-detection/values-scoring.yaml
            git commit -m "chore(deploy): bump scoring image to ${{ steps.meta.outputs.sha }} [skip ci]" || break
            git push origin HEAD:master && break
            sleep $((RANDOM % 5 + 1))
          done

  build-producer:
    if: ${{ inputs.producer == true }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: producer/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/producer:${{ steps.meta.outputs.sha }}
      - run: echo "Pushed producer:${{ steps.meta.outputs.sha }}"
      - name: Bump producer image tag in helm values (on master)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin master
            git checkout -B master origin/master
            sed -i "s|^  tag: .*|  tag: ${{ steps.meta.outputs.sha }}|" helm/fraud-detection/values-producer.yaml
            git add helm/fraud-detection/values-producer.yaml
            git commit -m "chore(deploy): bump producer image to ${{ steps.meta.outputs.sha }} [skip ci]" || break
            git push origin HEAD:master && break
            sleep $((RANDOM % 5 + 1))
          done

  build-query-api:
    if: ${{ inputs['query-api'] == true }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: query_api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/query-api:${{ steps.meta.outputs.sha }}
      - run: echo "Pushed query-api:${{ steps.meta.outputs.sha }}"
      - name: Bump query-api image tag in helm values (on master)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin master
            git checkout -B master origin/master
            sed -i "s|^  tag: .*|  tag: ${{ steps.meta.outputs.sha }}|" helm/fraud-detection/values-query-api.yaml
            git add helm/fraud-detection/values-query-api.yaml
            git commit -m "chore(deploy): bump query-api image to ${{ steps.meta.outputs.sha }} [skip ci]" || break
            git push origin HEAD:master && break
            sleep $((RANDOM % 5 + 1))
          done
