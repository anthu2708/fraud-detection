name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ── Step 1: detect which paths changed ────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      producer:  ${{ steps.filter.outputs.producer }}
      scoring:   ${{ steps.filter.outputs.scoring }}
      query_api: ${{ steps.filter.outputs.query_api }}
      shared:    ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            producer:
              - 'producer/**'
            scoring:
              - 'scoring/**'
              - 'src/**'
            query_api:
              - 'query_api/**'
            shared:
              - 'tests/**'
              - 'src/**'
              - 'requirements.txt'

  # ── Step 2: lint + test ───────────────────────────────────────────────────
  test:
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: pip install ruff
      - run: ruff check src/ tests/ query_api/ scoring/ producer/
      - run: pytest tests/ -v

  # ── Step 3: build + push with SHA tag, then commit the new tag straight
  #            into the service's helm values file so ArgoCD deploys it
  #            (no live-patching of Application objects, no ambiguity).
  #            Jobs run one after another (needs chain) so each git push
  #            targets a branch tip no other job is racing to move —
  #            no retry loop needed. ─────────────────────────────────────
  build-producer:
    needs: changes
    if: ${{ needs.changes.outputs.producer == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: producer/Dockerfile
          push: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/producer:${{ steps.meta.outputs.sha }}
      - name: Bump producer image tag in helm values
        if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="${GITHUB_REF#refs/heads/}"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          sed -i "s|^  tag: .*|  tag: ${{ steps.meta.outputs.sha }}|" helm/fraud-detection/values-producer.yaml
          git add helm/fraud-detection/values-producer.yaml
          git commit -m "chore(deploy): bump producer image to ${{ steps.meta.outputs.sha }} [skip ci]"
          git push origin "HEAD:$BRANCH"

  build-scoring:
    needs: [changes, build-producer]
    if: ${{ !cancelled() && needs.changes.outputs.scoring == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: scoring/Dockerfile
          push: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/scoring:${{ steps.meta.outputs.sha }}
      - name: Bump scoring image tag in helm values
        if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="${GITHUB_REF#refs/heads/}"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          sed -i "s|^  tag: .*|  tag: ${{ steps.meta.outputs.sha }}|" helm/fraud-detection/values-scoring.yaml
          git add helm/fraud-detection/values-scoring.yaml
          git commit -m "chore(deploy): bump scoring image to ${{ steps.meta.outputs.sha }} [skip ci]"
          git push origin "HEAD:$BRANCH"

  build-query-api:
    needs: [changes, build-producer, build-scoring]
    if: ${{ !cancelled() && needs.changes.outputs.query_api == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: query_api/Dockerfile
          push: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/query-api:${{ steps.meta.outputs.sha }}
      - name: Bump query-api image tag in helm values
        if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="${GITHUB_REF#refs/heads/}"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          sed -i "s|^  tag: .*|  tag: ${{ steps.meta.outputs.sha }}|" helm/fraud-detection/values-query-api.yaml
          git add helm/fraud-detection/values-query-api.yaml
          git commit -m "chore(deploy): bump query-api image to ${{ steps.meta.outputs.sha }} [skip ci]"
          git push origin "HEAD:$BRANCH"
