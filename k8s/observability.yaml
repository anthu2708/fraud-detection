# Lightweight observability: Prometheus + Grafana. No node-exporter,
# kube-state-metrics, or Alertmanager — the VM this cluster runs on is
# already tight on RAM (single e2-standard-2), so this only scrapes the
# app-level /metrics endpoints query-api and scoring already expose.
# Static scrape targets (not Kubernetes service discovery) since the
# service list here is small and fixed — keeps Prometheus RBAC-free too.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: query-api
        metrics_path: /metrics
        static_configs:
          - targets: ["query-api:8000"]
      - job_name: scoring
        metrics_path: /metrics
        static_configs:
          - targets: ["scoring:9100"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
  # storageClassName omitted → cluster default (local-path on k3s/k3d)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=3d
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        folder: ""
        type: file
        options:
          path: /etc/grafana/provisioning/dashboards-json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  pipeline-overview.json: |
    {
      "title": "Fraud Pipeline Overview",
      "uid": "fraud-pipeline-overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1, "title": "Total Scored", "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "sum(scoring_transactions_total)", "instant": true }],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "value", "graphMode": "area", "textMode": "auto"
          }
        },
        {
          "id": 2, "title": "Fraud Rate (5m)", "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "sum(rate(scoring_fraud_flagged_total[5m])) / sum(rate(scoring_transactions_total[5m]))" }],
          "fieldConfig": { "defaults": { "unit": "percentunit" } },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "value", "graphMode": "area", "textMode": "auto"
          }
        },
        {
          "id": 3, "title": "query-api", "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "up{job=\"query-api\"}", "instant": true }],
          "fieldConfig": {
            "defaults": {
              "mappings": [{ "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }],
              "thresholds": { "mode": "absolute", "steps": [{ "value": null, "color": "red" }, { "value": 1, "color": "green" }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "background", "textMode": "value" }
        },
        {
          "id": 4, "title": "scoring", "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "up{job=\"scoring\"}", "instant": true }],
          "fieldConfig": {
            "defaults": {
              "mappings": [{ "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }],
              "thresholds": { "mode": "absolute", "steps": [{ "value": null, "color": "red" }, { "value": 1, "color": "green" }] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "background", "textMode": "value" }
        },
        {
          "id": 5, "title": "Throughput (tx/s)", "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(rate(scoring_transactions_total[1m]))", "legendFormat": "scored/s" }
          ]
        },
        {
          "id": 6, "title": "Scoring Latency Distribution", "type": "heatmap",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(rate(scoring_latency_seconds_bucket[1m])) by (le)", "format": "heatmap", "legendFormat": "{{le}}" }
          ],
          "options": { "calculate": false, "color": { "scheme": "Spectral" } }
        },
        {
          "id": 7, "title": "Fraud Rate Over Time", "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit" } },
          "targets": [
            { "refId": "A", "expr": "sum(rate(scoring_fraud_flagged_total[5m])) / sum(rate(scoring_transactions_total[5m]))", "legendFormat": "fraud ratio" }
          ]
        },
        {
          "id": 8, "title": "Transactions by Source", "type": "piechart",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(scoring_transactions_total) by (source)", "instant": true, "legendFormat": "{{source}}" }
          ],
          "options": { "legend": { "displayMode": "list", "placement": "right" } }
        },
        {
          "id": 13, "title": "Current Scoring Latency (p50)", "type": "stat",
          "gridPos": { "h": 3, "w": 5, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "histogram_quantile(0.50, sum(rate(scoring_latency_seconds_bucket[1m])) by (le))", "instant": true }],
          "fieldConfig": { "defaults": { "unit": "s" } },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "value", "graphMode": "area", "textMode": "auto"
          }
        },
        {
          "id": 14, "title": "Current Scoring Latency (p95)", "type": "stat",
          "gridPos": { "h": 3, "w": 5, "x": 0, "y": 23 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "histogram_quantile(0.95, sum(rate(scoring_latency_seconds_bucket[1m])) by (le))", "instant": true }],
          "fieldConfig": { "defaults": { "unit": "s" } },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "value", "graphMode": "area", "textMode": "auto"
          }
        },
        {
          "id": 9, "title": "Scoring Latency (p50/p95)", "type": "timeseries",
          "gridPos": { "h": 6, "w": 19, "x": 5, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.50, sum(rate(scoring_latency_seconds_bucket[5m])) by (le))", "legendFormat": "p50" },
            { "refId": "B", "expr": "histogram_quantile(0.95, sum(rate(scoring_latency_seconds_bucket[5m])) by (le))", "legendFormat": "p95" }
          ]
        },
        {
          "id": 11, "title": "Current E2E Latency (p50)", "type": "stat",
          "gridPos": { "h": 3, "w": 5, "x": 19, "y": 26 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "histogram_quantile(0.50, sum(rate(pipeline_e2e_latency_seconds_bucket[1m])) by (le))", "instant": true }],
          "fieldConfig": { "defaults": { "unit": "s" } },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "value", "graphMode": "area", "textMode": "auto"
          }
        },
        {
          "id": 12, "title": "Current E2E Latency (p95)", "type": "stat",
          "gridPos": { "h": 3, "w": 5, "x": 19, "y": 29 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "histogram_quantile(0.95, sum(rate(pipeline_e2e_latency_seconds_bucket[1m])) by (le))", "instant": true }],
          "fieldConfig": { "defaults": { "unit": "s" } },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "value", "graphMode": "area", "textMode": "auto"
          }
        },
        {
          "id": 10, "title": "End-to-End Latency: Producer → Serve (p50/p95)", "type": "timeseries",
          "gridPos": { "h": 6, "w": 19, "x": 0, "y": 26 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.50, sum(rate(pipeline_e2e_latency_seconds_bucket[5m])) by (le))", "legendFormat": "p50" },
            { "refId": "B", "expr": "histogram_quantile(0.95, sum(rate(pipeline_e2e_latency_seconds_bucket[5m])) by (le))", "legendFormat": "p95" }
          ]
        }
      ]
    }
  query-api.json: |
    {
      "title": "Query API",
      "uid": "fraud-query-api",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1, "title": "Request rate", "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(rate(http_requests_total[1m])) by (handler)", "legendFormat": "{{handler}}" }
          ]
        },
        {
          "id": 2, "title": "Request latency (p95)", "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, handler))", "legendFormat": "{{handler}}" }
          ]
        },
        {
          "id": 3, "title": "5xx error rate", "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(rate(http_requests_total{status=~\"5..\"}[5m]))", "legendFormat": "5xx/s" }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.1
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key: admin-password
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            # Served under fraud.anphung.dev/grafana (path, not a subdomain)
            # — the ingress does NOT strip the /grafana prefix, so Grafana
            # itself needs to know it's not at the domain root.
            - name: GF_SERVER_ROOT_URL
              value: "https://fraud.anphung.dev/grafana"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            # Public Dashboards: lets a specific dashboard be viewed via a
            # no-login link (Share > Public dashboard in the Grafana UI)
            # without opening up the rest of Grafana.
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: "publicDashboards"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /etc/grafana/provisioning/dashboards-json
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          persistentVolumeClaim:
            claimName: grafana-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
  # storageClassName omitted → cluster default (local-path on k3s/k3d)
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  # No cert-manager annotation / tls block here on purpose: this shares the
  # fraud.anphung.dev hostname with the query-api ingress, which already
  # requests a cert for that host (query-api-tls). Traefik matches TLS certs
  # by SNI hostname across all Ingress objects, not per-object, so a second
  # cert request for the same host would just be redundant.
spec:
  rules:
    - host: fraud.anphung.dev
      http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
