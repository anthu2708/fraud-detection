image:
  repository: ghcr.io/anthu2708/fraud-detection/query-api
  tag: be77eb9df3e69d836d288ac926338bfc1b1710f0

imagePullSecrets:
  - name: ghcr-secret

env:
  KAFKA_BOOTSTRAP: "kafka:9092"

# DATABASE_URL comes from postgres-secret (created at deploy, not committed).
# See deploy-action.md Phase D.
envFrom:
  - secretRef:
      name: postgres-secret

service:
  enabled: true
  port: 8000
  nodePort: 30000

ingress:
  enabled: true
  host: fraud.anphung.dev
  clusterIssuer: letsencrypt-prod  # cert-manager issues TLS (Phase E)

livenessProbe:
  httpGet:
    path: /livez
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 5
  failureThreshold: 6
