image:
  repository: ghcr.io/anthu2708/fraud-detection/scoring
  tag: ff58b1b44c341748a6a0208c8d2ead0c2b26c47f

imagePullSecrets:
  - name: ghcr-secret

env:
  KAFKA_BOOTSTRAP: "kafka:9092"
  MODEL_PATH: "/app/models/isolation_forest_v2.pkl"
  MODEL_VERSION: "v2"
  PYTHONUNBUFFERED: "1"
  METRICS_PORT: "9100"

service:
  enabled: true
  port: 9100

volumeMounts:
  - name: models
    mountPath: /app/models

volumes:
  - name: models
    hostPath:
      path: /fraud-models
