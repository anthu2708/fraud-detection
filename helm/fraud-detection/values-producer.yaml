replicaCount: 1

image:
  repository: ghcr.io/anthu2708/fraud-detection/producer
  tag: ff58b1b44c341748a6a0208c8d2ead0c2b26c47f

imagePullSecrets:
  - name: ghcr-secret

env:
  KAFKA_BOOTSTRAP: "kafka:9092"
  TX_PER_SECOND: "200"
  DATA_PATH: "/app/data/creditcard_test.csv"
  PYTHONUNBUFFERED: "1"

volumeMounts:
  - name: data
    mountPath: /app/data

volumes:
  - name: data
    hostPath:
      path: /fraud-data
