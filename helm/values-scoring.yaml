image:
  repository: ghcr.io/anthu2708/fraud-detection/scoring
  tag: latest

env:
  KAFKA_BOOTSTRAP: "kafka:9092"
  MODEL_PATH: "/app/models/isolation_forest_v2.pkl"
  MODEL_VERSION: "v2"
  PYTHONUNBUFFERED: "1"

volumeMounts:
  - name: models
    mountPath: /app/models

volumes:
  - name: models
    hostPath:
      path: /fraud-models
