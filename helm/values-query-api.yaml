image:
  repository: ghcr.io/anthu2708/fraud-detection/query-api
  tag: latest

imagePullSecrets:
  - name: ghcr-secret

env:
  KAFKA_BOOTSTRAP: "kafka:9092"
  DATABASE_URL: "postgresql://fraud:fraud@postgres:5432/fraud"

service:
  enabled: true
  port: 8000
  nodePort: 30000

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 2
