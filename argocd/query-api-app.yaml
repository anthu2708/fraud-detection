apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: query-api
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/anthu2708/fraud-detection
      targetRevision: master
      path: helm/fraud-detection
      helm:
        valueFiles:
          - $values/helm/values-query-api.yaml
    - repoURL: https://github.com/anthu2708/fraud-detection
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
