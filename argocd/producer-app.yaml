apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: producer
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: producer=ghcr.io/anthu2708/fraud-detection/producer
    argocd-image-updater.argoproj.io/producer.update-strategy: latest
    argocd-image-updater.argoproj.io/producer.allow-tags: regexp:^sha-
    argocd-image-updater.argoproj.io/producer.pull-secret: pullsecret:argocd/ghcr-secret
spec:
  project: default
  sources:
    - repoURL: https://github.com/anthu2708/fraud-detection
      targetRevision: master
      path: helm/fraud-detection
      helm:
        valueFiles:
          - $values/helm/values-producer.yaml
    - repoURL: https://github.com/anthu2708/fraud-detection
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
